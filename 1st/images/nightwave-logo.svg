<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular background -->
  <circle cx="256" cy="256" r="240" fill="#0a0e27"/>
  <circle cx="256" cy="256" r="240" stroke="#4a7bff" stroke-width="8"/>
  
  <!-- Wave patterns -->
  <path d="M100 256 Q150 200, 200 256 T300 256 T400 256" 
        stroke="#4a7bff" stroke-width="12" fill="none" stroke-linecap="round"/>
  
  <path d="M100 280 Q150 220, 200 280 T300 280 T400 280" 
        stroke="#5a8bff" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.7"/>
  
  <path d="M100 300 Q150 240, 200 300 T300 300 T400 300" 
        stroke="#6a9bff" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Moon/Circle accent -->
  <circle cx="256" cy="180" r="40" fill="#4a7bff"/>
  <circle cx="266" cy="170" r="35" fill="#0a0e27"/>
  
  <!-- Stars -->
  <circle cx="180" cy="150" r="3" fill="#fff"/>
  <circle cx="320" cy="140" r="2" fill="#fff"/>
  <circle cx="200" cy="180" r="2" fill="#fff"/>
  <circle cx="310" cy="190" r="3" fill="#fff"/>
  <circle cx="350" cy="160" r="2" fill="#fff"/>
  
  <!-- Sound wave bars at bottom -->
  <rect x="220" y="340" width="8" height="40" rx="4" fill="#4a7bff"/>
  <rect x="235" y="330" width="8" height="60" rx="4" fill="#5a8bff"/>
  <rect x="250" y="320" width="8" height="80" rx="4" fill="#4a7bff"/>
  <rect x="265" y="330" width="8" height="60" rx="4" fill="#5a8bff"/>
  <rect x="280" y="340" width="8" height="40" rx="4" fill="#4a7bff"/>
</svg>
