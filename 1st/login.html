<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" href="./images/nightwave-logo.svg">
    <title>Login - NightWave</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <img src="./images/nightwave-logo.svg" alt="NightWave Logo" class="auth-logo">
                <h1>Welcome to NightWave</h1>
                <p class="auth-subtitle">Login to continue your music journey</p>
            </div>
            
            <form class="auth-form">
                <div class="form-group">
                    <label for="email">Email or Username</label>
                    <input type="text" id="email" placeholder="Enter your email or username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>
                
                <button type="submit" class="auth-button">Log In</button>
                
                <div class="divider">
                    <span>OR</span>
                </div>
                
                <button type="button" class="social-button google">
                    <i class="fa-brands fa-google"></i>
                    Continue with Google
                </button>
                
                <button type="button" class="social-button facebook">
                    <i class="fa-brands fa-facebook"></i>
                    Continue with Facebook
                </button>
                
                <button type="button" class="social-button apple">
                    <i class="fa-brands fa-apple"></i>
                    Continue with Apple
                </button>
            </form>
            
            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Sign up for NightWave</a></p>
            </div>
        </div>
        
        <div class="auth-background">
            <div class="wave-animation"></div>
            <div class="wave-animation"></div>
            <div class="wave-animation"></div>
        </div>
    </div>
</body>
</html>
