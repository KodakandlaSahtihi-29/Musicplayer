<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" href="./images/nightwave-logo.svg">
    <title>Sign Up - NightWave</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <img src="./images/nightwave-logo.svg" alt="NightWave Logo" class="auth-logo">
                <h1>Join NightWave</h1>
                <p class="auth-subtitle">Create your account and start listening</p>
            </div>
            
            <form class="auth-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Choose a username" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create a password" required>
                </div>
                
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="Confirm your password" required>
                </div>
                
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" required>
                        <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
                    </label>
                </div>
                
                <button type="submit" class="auth-button">Create Account</button>
                
                <div class="divider">
                    <span>OR</span>
                </div>
                
                <button type="button" class="social-button google">
                    <i class="fa-brands fa-google"></i>
                    Sign up with Google
                </button>
                
                <button type="button" class="social-button facebook">
                    <i class="fa-brands fa-facebook"></i>
                    Sign up with Facebook
                </button>
                
                <button type="button" class="social-button apple">
                    <i class="fa-brands fa-apple"></i>
                    Sign up with Apple
                </button>
            </form>
            
            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Log in here</a></p>
            </div>
        </div>
        
        <div class="auth-background">
            <div class="wave-animation"></div>
            <div class="wave-animation"></div>
            <div class="wave-animation"></div>
        </div>
    </div>
</body>
</html>
